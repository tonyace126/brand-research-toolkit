<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}} — {{AUTHOR}}</title>
  <meta name="description" content="{{TLDR}}">
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a1a;
      --color-muted: #6b7280;
      --color-accent: #2563eb;
      --color-border: #e5e7eb;
      --color-card: #f9fafb;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "PingFang TC", "Noto Sans TC", sans-serif;
      --max-width: 760px;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      margin: 0;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 32px 20px 80px;
    }
    .topnav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 32px;
      font-size: 14px;
    }
    .topnav a { color: var(--color-muted); text-decoration: none; }
    .topnav a:hover { color: var(--color-accent); }
    h1 {
      font-size: 32px;
      line-height: 1.3;
      margin: 24px 0 8px;
      font-weight: 700;
    }
    .meta {
      color: var(--color-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .tldr {
      background: var(--color-card);
      border-left: 3px solid var(--color-accent);
      padding: 16px 20px;
      border-radius: var(--radius);
      margin: 24px 0 40px;
    }
    h2 {
      font-size: 22px;
      margin-top: 48px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
    }
    h3 { font-size: 18px; margin-top: 32px; }
    p { margin: 0 0 16px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--color-border);
      vertical-align: top;
    }
    th { background: var(--color-card); font-weight: 600; }
    tr:hover td { background: var(--color-card); }
    a { color: var(--color-accent); }
    a:hover { text-decoration: underline; }
    blockquote {
      margin: 16px 0;
      padding: 8px 16px;
      border-left: 3px solid var(--color-border);
      color: var(--color-muted);
    }
    code {
      background: var(--color-card);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .sources {
      margin-top: 60px;
      font-size: 13px;
      color: var(--color-muted);
    }
    .sources ul { padding-left: 20px; }
    .sources li { margin-bottom: 6px; }
    .footer {
      margin-top: 60px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
      color: var(--color-muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 600px) {
      h1 { font-size: 24px; }
      h2 { font-size: 20px; }
      table { font-size: 13px; }
      th, td { padding: 8px; }
      .container { padding: 16px 16px 60px; }
    }
  </style>
  {{THEME_OVERRIDE_LINK}}
</head>
<body>
  <div class="container">
    <nav class="topnav">
      <a href="{{HOME_URL}}">← 首頁</a>
      <span>{{DATE}}</span>
    </nav>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{AUTHOR}} · {{DATE}} · 約 {{READ_TIME}} 分鐘</p>
    <div class="tldr"><strong>TL;DR：</strong>{{TLDR}}</div>

    {{BODY}}

    <section class="sources">
      <h2>來源</h2>
      <ul>{{SOURCES}}</ul>
    </section>

    <footer class="footer">
      © {{YEAR}} {{AUTHOR}} · Generated by <a href="https://github.com/tonyace126/brand-research-toolkit">brand-research-toolkit</a>
    </footer>
  </div>
</body>
</html>
